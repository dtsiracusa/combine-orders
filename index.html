<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wieland Healthcare — Combine Orders</title>
  <style>
    body { margin: 0; padding: 24px 0; font-family: "Segoe UI", Arial, sans-serif; background: #f5f5f5;
           display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; box-sizing: border-box; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            max-width: 820px; width: 94%; overflow: hidden; }
    .card-header { padding: 28px 24px 16px; text-align: center; }
    .icon { font-size: 40px; }
    .card-header h1 { margin: 8px 0 0; font-size: 22px; color: #212121; }
    .logo { width: 100%; max-width: 160px; height: auto; margin-bottom: 8px; }
    .card-body { padding: 20px 24px; color: #555; font-size: 15px; line-height: 1.5; }
    .card-footer { padding: 16px 24px 24px; text-align: center; border-top: 1px solid #eee; }
    .ready .card-header, .loading .card-header, .info .card-header { background: #e3f2fd; }
    .ready .icon, .loading .icon, .info .icon { color: #1565c0; }
    .success .card-header { background: #e8f5e9; } .success .icon { color: #2e7d32; }
    .fail .card-header { background: #fce4ec; } .fail .icon { color: #c62828; }
    .message { font-size: 17px; text-align: center; margin: 0 0 8px; white-space: pre-line; }
    .btn { display: inline-block; padding: 12px 28px; color: #fff; background: #1565c0; border: none;
           border-radius: 6px; font-size: 16px; cursor: pointer; font-family: inherit; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #90caf9; outline-offset: 2px; }
    .btn-secondary { background: #9e9e9e; margin-right: 8px; }
    .btn-small { padding: 6px 14px; font-size: 14px; }
    .btn-undo { background: #ef6c00; }
    .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #ccc; border-top: 4px solid #1565c0;
               border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .section-title { font-size: 13px; font-weight: 600; color: #1565c0; text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
    .item { border: 1px solid #e0e0e0; border-left: 6px solid var(--gc, #e0e0e0); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; position: relative; }
    .item.parent { border-color: #90caf9; border-left-color: var(--gc, #90caf9); background: #f5faff; }
    .item.disabled { background: #fafafa; color: #9e9e9e; }
    .item-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
    .item-name { font-size: 17px; font-weight: 600; color: #212121; }
    .item.disabled .item-name { color: #9e9e9e; }
    .item-name a { color: inherit; }
    .group { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #eeeeee; color: #616161; }
    .soldto { font-size: 14px; margin-top: 2px; }
    .notes { font-size: 13px; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
    .notes span { color: #9e9e9e; display: block; font-size: 11px; text-transform: uppercase; }
    .vals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 12px; font-size: 13px; margin-top: 8px; }
    .vals span { color: #9e9e9e; display: block; font-size: 11px; text-transform: uppercase; }
    .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .b-match { background: #e8f5e9; color: #2e7d32; }
    .b-possible { background: #fff8e1; color: #8d6e00; }
    .b-other { background: #fce4ec; color: #ad1457; }
    .b-nocity { background: #eeeeee; color: #616161; }
    .sot { position: absolute; top: 0; right: 0; max-width: 140px; padding: 4px 12px; border-radius: 0 7px 0 10px;
           font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sot span { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .04em; opacity: .85; }
    .item-top.has-sot { padding-right: 150px; }
    .item.disabled .sot, .item.disabled .group { opacity: .55; }
    @media (max-width: 480px) { .item-top.has-sot { padding-right: 0; margin-top: 30px; } .sot { max-width: 80%; } }
    .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .choices label { border: 1px solid #ccc; border-radius: 6px; padding: 6px 12px; font-size: 14px; cursor: pointer; user-select: none; }
    .choices input { margin: 0 6px 0 0; }
    .choices label.on-move { background: #e8f5e9; border-color: #2e7d32; }
    .choices label.on-dismiss { background: #fce4ec; border-color: #c62828; }
    .note { font-size: 13px; margin-top: 8px; color: #616161; }
    .note.warn { color: #ad1457; }
    .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .who label { font-size: 14px; }
    .who select { padding: 6px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; }
    .counts { font-size: 14px; color: #555; margin: 0 0 12px; }
    .result-row { border-left: 4px solid #9e9e9e; padding: 8px 12px; margin-bottom: 8px; background: #fafafa; border-radius: 4px; font-size: 14px; }
    .result-row.ok { border-color: #2e7d32; } .result-row.partial { border-color: #ef6c00; }
    .result-row.failed { border-color: #c62828; } .result-row.skipped { border-color: #9e9e9e; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center;
                     align-items: flex-start; overflow-y: auto; z-index: 1000; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; max-width: 520px; width: 92%; margin: 32px auto; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .modal h2 { margin: 0; padding: 18px 24px; font-size: 18px; color: #212121; border-bottom: 1px solid #eee; }
    .modal-body { padding: 16px 24px; font-size: 14px; color: #444; line-height: 1.5; }
    .modal-body ul { margin: 6px 0 12px; padding-left: 20px; }
    .modal-footer { padding: 14px 24px 18px; text-align: right; border-top: 1px solid #eee; }
    .modal-footer .btn { font-size: 15px; padding: 10px 22px; }
    .hidden { display: none !important; }
  </style>
</head>

  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="btn" id="submitBtn">Confirm</button>
      </div>

  <script>
    // UPDATE THIS to the Combine Orders Apps Script deployment URL (/exec).
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyc6BOZqTw9EaPkLQUNBurLio_LxAFJCUhFLlm89EN5FU1pR-Qbe0_VKNK2RF1rhvi7RQ/exec";
    // People who can be selected as the confirmer. The first entry is the default.
    var CONFIRMERS = ["Dante Siracusa", "Joshua McCann"];
    var LOAD_TIMEOUT_MS = 30000;
    var SUBMIT_TIMEOUT_MS = 120000;   // moves take a few seconds each

    var params = new URLSearchParams(window.location.search);
    var parentId = (params.get("p") || "").replace(/\D/g, "");
    var childParam = params.get("c") || "";
    var data = null;          // last load response
    var choices = {};         // childId -> "leave" | "move" | "dismiss"
    var busy = false;

    var $ = function (id) { return document.getElementById(id); };

    // ---------- JSONP ----------
    var jsonpSeq = 0;
    function callApi(query, timeoutMs, done) {
      var name = "coCb" + (++jsonpSeq) + "_" + Date.now();
      var finished = false;
      var script = document.createElement("script");
      var timer = setTimeout(function () { end({ success: false, title: "Taking Too Long",
        message: "The service didn't respond. Reload the page to see the current state before trying again." }); }, timeoutMs);
      function end(res) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        done(res || { success: false, title: "Error", message: "Empty response." });
      }
      window[name] = end;
      script.src = APPS_SCRIPT_URL + "?" + query + "&callback=" + name + "&_=" + Date.now();
      script.onerror = function () { end({ success: false, title: "Error",
        message: "Couldn't reach the service. Try again in a few minutes." }); };
      document.body.appendChild(script);
    }

    // ---------- State / layout ----------
    function setState(cls, icon, title, message) {
      $("card").className = "card " + cls;
      $("icon").innerHTML = icon;     // icon is always a fixed literal in this file
      $("title").textContent = title;
      $("message").textContent = message || "";
      $("message").classList.toggle("hidden", !message);
      document.title = title + " — Wieland Healthcare";
    }
    function spinner(title, msg) { setState("loading", '<div class="spinner"></div>', title, msg); }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined && text !== null) e.textContent = text;
      return e;
    }
    function link(text, url) {
      if (!url) return document.createTextNode(text);
      var a = el("a", null, text); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a;
    }
    function validHex(h) { return /^#[0-9a-f]{6}$/i.test(h || ""); }
    function textOn(hex) {
      var n = parseInt(hex.slice(1), 16);
      var lum = 0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255);
      return lum > 160 ? "#212121" : "#ffffff";
    }
    function setGroupColor(item, color) { if (validHex(color)) item.style.setProperty("--gc", color); }
    function groupChip(title, color) {
      var g = el("div", "group", title);
      if (validHex(color)) { g.style.background = color; g.style.color = textOn(color); }
      return g;
    }
    function subTypeTab(label, color) {
      if (!label) return null;
      var t = el("div", "sot");
      t.appendChild(el("span", null, "Sub-Order Type"));
      t.appendChild(document.createTextNode(label));
      var bg = validHex(color) ? color : "#c4c4c4";
      t.style.background = bg; t.style.color = textOn(bg);
      t.title = "Sub-Order Type: " + label;
      return t;
    }

    // ---------- Load ----------
    function load() {
      if (!parentId || !childParam) {
        setState("fail", "\u2718", "Link Problem", "This link is incomplete. Open it again from the email.");
        return;
      }
      if (APPS_SCRIPT_URL.indexOf("PASTE") === 0) {
        setState("fail", "\u2718", "Not Configured", "APPS_SCRIPT_URL has not been set in this page.");
        return;
      }
      spinner("Loading...", "Please wait while the items are loaded.");
      $("review").classList.add("hidden");
      $("results").classList.add("hidden");
      $("reviewBtn").classList.add("hidden");
      $("backBtn").classList.add("hidden");
      callApi("action=load&p=" + encodeURIComponent(parentId) + "&k=" + encodeURIComponent(childParam),
        LOAD_TIMEOUT_MS, onLoad);
    }

    function onLoad(res) {
      if (!res.success) {
        setState("fail", "\u2718", res.title || "Error", res.message || "");
        if (res.blocked && res.parent) {
          $("review").classList.remove("hidden");
          $("childList").textContent = ""; $("counts").textContent = "";
          $("whoSelect").parentNode.classList.add("hidden");
          renderParent(res.parent, res.copyCols);
        }
        return;
      }
      data = res;
      choices = {};
      setState("ready", "&#128203;", "Combine Orders",
        "Choose which jobs to move next to the parent. Moved jobs go into the parent's group, directly below it, " +
        "and take the parent's " + res.copyCols.join(", ") + " (blank parent values leave the job's value alone).");
      $("whoSelect").parentNode.classList.remove("hidden");
      renderParent(res.parent, res.copyCols);
      renderChildren();
      $("review").classList.remove("hidden");
      $("reviewBtn").classList.remove("hidden");
      updateReviewBtn();
    }

    function renderValues(container, labels, values) {
      var g = el("div", "vals");
      labels.forEach(function (lab, i) {
        var d = el("div");
        d.appendChild(el("span", null, lab));
        d.appendChild(document.createTextNode(values[i] || "—"));
        g.appendChild(d);
      });
      container.appendChild(g);
    }

    function renderNotes(container, text) {
      var d = el("div", "notes");
      d.appendChild(el("span", null, "Mid-Notes"));
      d.appendChild(document.createTextNode(text || "—"));
      container.appendChild(d);
    }

    function renderParent(p, labels) {
      var box = $("parentBox");
      box.textContent = "";
      var item = el("div", "item parent");
      setGroupColor(item, p.groupColor);
      var sot = subTypeTab(p.subType, p.subTypeColor);
      if (sot) item.appendChild(sot);
      var top = el("div", "item-top" + (sot ? " has-sot" : ""));
      var n = el("div", "item-name"); n.appendChild(link(p.name, p.url)); top.appendChild(n);
      top.appendChild(groupChip(p.group, p.groupColor));
      item.appendChild(top);
      item.appendChild(el("div", "soldto", (p.soldTo || "(no Sold-To)") + "  |  " + (p.city || "(no City, State)")));
      if (labels) renderValues(item, labels, p.values || []);
      renderNotes(item, p.notes);
      box.appendChild(item);
    }

    function badgeFor(c) {
      var wrap = document.createDocumentFragment();
      if (c.tier) {
        var cls = c.tier === "Match" ? "b-match" : (c.tier === "Possible" ? "b-possible" : "b-other");
        wrap.appendChild(el("span", "badge " + cls, c.tier + " (" + c.score + ")"));
      }
      if (c.noCity) wrap.appendChild(el("span", "badge b-nocity", "No City"));
      return wrap;
    }

    function renderChildren() {
      var list = $("childList");
      list.textContent = "";
      var avail = 0;
      data.children.forEach(function (c) {
        var disabled = c.status !== "available";
        if (!disabled) avail++;
        var item = el("div", "item" + (disabled ? " disabled" : ""));
        setGroupColor(item, c.groupColor);
        var sot = subTypeTab(c.subType, c.subTypeColor);
        if (sot) item.appendChild(sot);
        var top = el("div", "item-top" + (sot ? " has-sot" : ""));
        var n = el("div", "item-name"); n.appendChild(link(c.name, c.url)); top.appendChild(n);
        if (c.group) top.appendChild(groupChip(c.group, c.groupColor));
        top.appendChild(badgeFor(c));
        item.appendChild(top);
        if (c.soldTo !== undefined) {
          item.appendChild(el("div", "soldto", (c.soldTo || "(no Sold-To)") + "  |  " + (c.city || "(no City, State)")));
          renderValues(item, data.copyCols, c.values || []);
          renderNotes(item, c.notes);
        }

        if (!disabled) {
          var ch = el("div", "choices");
          ch.setAttribute("role", "radiogroup");
          ch.setAttribute("aria-label", "Action for " + c.name);
          [["leave", "Leave as is"], ["move", "Move with parent"], ["dismiss", "Not a match"]].forEach(function (o) {
            var lab = el("label");
            var r = document.createElement("input");
            r.type = "radio"; r.name = "ch_" + c.id; r.value = o[0];
            r.checked = (choices[c.id] || "leave") === o[0];
            r.addEventListener("change", function () {
              choices[c.id] = o[0];
              refreshChoiceStyles(ch);
              updateReviewBtn();
            });
            lab.appendChild(r); lab.appendChild(document.createTextNode(o[1]));
            ch.appendChild(lab);
          });
          refreshChoiceStyles(ch);
          item.appendChild(ch);
        } else {
          item.appendChild(el("div", "note" + (c.status === "stale" ? " warn" : ""), c.note || ""));
          if (c.status === "moved" && c.batchId) {
            var ub = el("button", "btn btn-small btn-undo", "Undo Move");
            ub.type = "button";
            ub.style.marginTop = "8px";
            ub.addEventListener("click", function () { undoMove(c, ub); });
            item.appendChild(ub);
          }
        }
        list.appendChild(item);
      });
      $("counts").textContent = data.children.length + " item(s), " + avail + " available to act on.";
    }

    function refreshChoiceStyles(ch) {
      Array.prototype.forEach.call(ch.querySelectorAll("label"), function (lab) {
        var r = lab.querySelector("input");
        lab.className = r.checked && r.value === "move" ? "on-move" : (r.checked && r.value === "dismiss" ? "on-dismiss" : "");
      });
    }

    function selected(kind) {
      return data.children.filter(function (c) { return c.status === "available" && choices[c.id] === kind; });
    }
    function updateReviewBtn() {
      $("reviewBtn").disabled = busy || (selected("move").length + selected("dismiss").length) === 0;
    }

    // ---------- Confirm ----------
    function openConfirm() {
      var mv = selected("move"), ds = selected("dismiss");
      var body = $("confirmBody");
      body.textContent = "";
      body.appendChild(el("div", null, "Confirmed by: " + $("whoSelect").value));
      if (mv.length) {
        body.appendChild(el("p", null, "Move " + mv.length + " job(s) into \u201c" + data.parent.group +
          "\u201d directly below " + data.parent.name + ", and copy the parent's " + data.copyCols.join(", ") + ":"));
        var ul = el("ul");
        mv.forEach(function (c) { ul.appendChild(el("li", null, c.name + " (from " + c.group + ")")); });
        body.appendChild(ul);
      }
      if (ds.length) {
        body.appendChild(el("p", null, "Mark " + ds.length + " job(s) as not a match (they won't be reported again for this parent):"));
        var ul2 = el("ul");
        ds.forEach(function (c) { ul2.appendChild(el("li", null, c.name)); });
        body.appendChild(ul2);
      }
      $("confirmModal").classList.add("open");
      $("submitBtn").focus();
    }
    function closeConfirm() { $("confirmModal").classList.remove("open"); }

    function submit() {
      if (busy) return;
      busy = true;
      closeConfirm();
      var mv = selected("move").map(function (c) { return c.id; });
      var ds = selected("dismiss").map(function (c) { return c.id; });
      $("review").classList.add("hidden");
      $("reviewBtn").classList.add("hidden");
      spinner("Submitting...", "Moving " + mv.length + " job(s). This can take a minute; don't close this tab.");
      callApi("action=commit&p=" + encodeURIComponent(parentId) + "&k=" + encodeURIComponent(childParam) +
        "&move=" + encodeURIComponent(mv.join(",")) + "&dismiss=" + encodeURIComponent(ds.join(",")) +
        "&who=" + encodeURIComponent($("whoSelect").value), SUBMIT_TIMEOUT_MS, onSubmit);
    }

    function onSubmit(res) {
      busy = false;
      if (!res.success) {
        setState("fail", "\u2718", res.title || "Error", res.message || "");
        $("backBtn").classList.remove("hidden");
        return;
      }
      var bad = res.results.filter(function (r) { return r.result !== "OK"; }).length;
      setState(bad ? "info" : "success", bad ? "\u2139" : "\u2714", bad ? "Submitted With Notes" : "Done",
        bad ? "Some items need attention. Details are below and in the log." : "All changes were applied.");
      var box = $("results");
      box.textContent = "";
      res.results.forEach(function (r) {
        var row = el("div", "result-row " + String(r.result || "").toLowerCase());
        row.appendChild(el("strong", null, r.name + " \u2014 " + r.action + ": " + r.result));
        if (r.note) row.appendChild(el("div", "note", r.note));
        if (r.action === "Move" && (r.result === "OK" || r.result === "Partial") && r.batchId) {
          var ub = el("button", "btn btn-small btn-undo", "Undo Move");
          ub.type = "button"; ub.style.marginTop = "6px";
          ub.addEventListener("click", function () { undoMove({ id: r.id, name: r.name, batchId: r.batchId }, ub); });
          row.appendChild(ub);
        }
        box.appendChild(row);
      });
      box.classList.remove("hidden");
      $("backBtn").classList.remove("hidden");
    }

    // ---------- Undo ----------
    function undoMove(c, btn) {
      if (busy) return;
      if (!window.confirm("Undo the move of " + c.name + "?\nIt will go back to its original group, position, and values.")) return;
      busy = true;
      btn.disabled = true;
      btn.textContent = "Undoing...";
      callApi("action=undo&batch=" + encodeURIComponent(c.batchId) + "&child=" + encodeURIComponent(c.id) +
        "&who=" + encodeURIComponent($("whoSelect").value), SUBMIT_TIMEOUT_MS, function (res) {
          busy = false;
          window.alert((res.title || (res.success ? "Undone" : "Error")) + "\n\n" + (res.message || ""));
          if (res.success) { btn.textContent = "Undone"; }
          else { btn.disabled = false; btn.textContent = "Undo Move"; }
        });
    }

    // ---------- Init ----------
    (function init() {
      var sel = $("whoSelect");
      CONFIRMERS.forEach(function (n, i) {
        var o = el("option", null, n); o.value = n; if (i === 0) o.selected = true; sel.appendChild(o);
      });
      $("reviewBtn").addEventListener("click", openConfirm);
      $("cancelBtn").addEventListener("click", closeConfirm);
      $("submitBtn").addEventListener("click", submit);
      $("backBtn").addEventListener("click", load);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && $("confirmModal").classList.contains("open")) closeConfirm();
      });
      load();
    })();
  </script>
</body>
</html>
