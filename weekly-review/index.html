<!DOCTYPE html>
<html>

<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'
  fill='none'
  stroke='currentColor'
  stroke-width='2'
  stroke-linecap='round'
  stroke-linejoin='round'
>

  <path d='M16 3v4' />
  <path d='M8 3v4' />
  <path d='M4 11h16' />
  <path d='M7 14h.013' />
  <path d='M10.01 14h.005' />
  <path d='M13.01 14h.005' />
  <path d='M16.015 14h.005' />
  <path d='M13.015 17h.005' />

  <path d='M10.01 17h.005' />
</svg>">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- <title>Wieland Healthcare — Upcoming Week Review</title> -->
  <title>Wieland Healthcare — Master Page</title>
  <style>
    body {
      margin: 0;
      padding: 24px 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      max-width: 900px;
      width: 94%;
      overflow: hidden;
      overflow: clip;   /* Master Page: clip keeps the rounded corners but lets the tab bar stick; older browsers use hidden */
    }

    .card-header {
      padding: 28px 24px 16px;
      text-align: center;
      position: relative; /* anchors the tech page menu */
    }

    .icon {
      font-size: 40px;
    }

    .card-header h1 {
      margin: 8px 0 0;
      font-size: 22px;
      color: #212121;
    }

    .logo {
      width: 100%;
      max-width: 160px;
      height: auto;
      margin-bottom: 8px;
    }

    .card-body {
      padding: 20px 24px;
      color: #555;
      font-size: 15px;
      line-height: 1.5;
    }

    .card-footer {
      padding: 16px 24px 24px;
      text-align: center;
      border-top: 1px solid #eee;
    }

    .ready .card-header,
    .loading .card-header,
    .info .card-header {
      background: #e3f2fd;
    }

    .ready .icon,
    .loading .icon,
    .info .icon {
      color: #1565c0;
    }

    .loading .card-header svg {
      display: none;
    }

    .success .card-header {
      background: #e8f5e9;
    }

    .success .icon {
      color: #2e7d32;
    }

    .fail .card-header {
      background: #fce4ec;
    }

    .fail .icon {
      color: #c62828;
    }

    .message {
      font-size: 17px;
      text-align: center;
      margin: 0 0 8px;
      white-space: pre-line;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      color: #fff;
      background: #1565c0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    .btn-secondary {
      background: #9e9e9e;
      margin-right: 8px;
    }

    .btn-small {
      padding: 6px 14px;
      font-size: 14px;
    }

    .btn-outline {
      background: #fff;
      color: #1565c0;
      border: 1px solid #1565c0;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top: 4px solid #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .who {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .who label {
      font-size: 14px;
    }

    .who select {
      padding: 6px 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
    }

    .counts {
      font-size: 14px;
      color: #555;
      margin: 8px 0 12px;
    }

    .item {
      border: 1px solid #e0e0e0;
      border-left: 6px solid var(--gc, #e0e0e0);
      border-radius: 8px;
      padding: 12px 14px 12px;
      margin-bottom: 12px;
      position: relative;
    }

    .item.disabled {
      background: #fafafa;
      color: #9e9e9e;
    }

    .item.disabled .cs-tab,
    .item.disabled .chip {
      opacity: .55;
    }

    .cs-tab {
      /* position: absolute; */
      /* top: 0; */
      /* right: 0; */
      max-width: 200px;
      min-width: 0;
      padding: 4px 12px;
      /* border-radius: 0 7px 0 10px; */
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cs-tab span {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .85;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px 16px;
      flex-wrap: wrap;
      padding-right: 120px;
    }

    .soldto {
      font-size: 16px;
      font-weight: 600;
      color: #212121;
    }

    .item.disabled .soldto {
      color: #9e9e9e;
    }

    .city {
      font-size: 14px;
    }

    .item-name {
      font-size: 17px;
      font-weight: 600;
      color: #212121;
      text-align: left;
      margin-left: 0;
    }

    .item.disabled .item-name {
      color: #9e9e9e;
    }

    .item-name a {
      color: inherit;
    }

    .head-left {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .caret {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      margin-top: 1px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #616161;
      font-size: 18px;
      line-height: 26px;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .caret:hover {
      background: #eeeeee;
    }

    .caret:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    .item.collapsed .caret {
      transform: rotate(-90deg);
    }

    .item.collapsed .item-body {
      display: none;
    }

    .label {
      color: #9e9e9e;
      display: block;
      font-size: 11px;
      text-transform: uppercase;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 6px 12px;
      margin-top: 10px;
    }

    .chip {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 10px;
      background: #c4c4c4;
      color: #212121;
    }

    .vals {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px 12px;
      font-size: 13px;
      margin-top: 10px;
    }

    .vals a {
      color: #1565c0;
      word-break: break-all;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .notes {
      font-size: 13px;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .choices label {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .choices input {
      margin: 0 6px 0 0;
    }

    .choices label.on-approve {
      background: #e8f5e9;
      border-color: #2e7d32;
    }

    .note {
      font-size: 13px;
      margin-top: 10px;
      color: #616161;
    }

    .note.warn {
      color: #ad1457;
    }

    .result-row {
      border-left: 4px solid #9e9e9e;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #fafafa;
      border-radius: 4px;
      font-size: 14px;
    }

    .result-row.ok {
      border-color: #2e7d32;
    }

    .result-row.partial {
      border-color: #ef6c00;
    }

    .result-row.failed {
      border-color: #c62828;
    }

    .result-row.skipped {
      border-color: #9e9e9e;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      max-width: 520px;
      width: 92%;
      margin: 32px auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      margin: 0;
      padding: 18px 24px;
      font-size: 18px;
      color: #212121;
      border-bottom: 1px solid #eee;
    }

    .modal-body {
      padding: 16px 24px;
      font-size: 14px;
      color: #444;
      line-height: 1.5;
    }

    .modal-body ul {
      margin: 6px 0 12px;
      padding-left: 20px;
    }

    .modal-footer {
      padding: 14px 24px 18px;
      text-align: right;
      border-top: 1px solid #eee;
    }

    .modal-footer .btn {
      font-size: 15px;
      padding: 10px 22px;
    }

    .hidden {
      display: none !important;
    }

    .tb-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .page-nav {
      text-align: right;
      margin-bottom: 10px;
    }

    .approve-toggle {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-family: inherit;
      color: #212121;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }

    .approve-toggle.on-approve {
      background: #e8f5e9;
      border-color: #2e7d32;
    }

    .approve-toggle:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    /* Top-right tab row: Order Status (Last Week only) + Review Status, side by side */
    .tabs {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      border-radius: 0 7px 0 10px;
      overflow: hidden;
    }

    .item.two-tabs .item-head {
      padding-right: 250px;
    }

    /* Last Week / This Week toggle */
    .page-nav .btn,
    .nav-foot .btn {
      margin: 4px;
    }

    .nav-foot {
      display: inline-block;
    }

    /* Tech page menu (top-right of the blue card header) */
    .tech-menu {
      position: absolute;
      top: 12px;
      right: 12px;
      text-align: left;
      z-index: 30;
    }

    .menu-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid #1565c0;
      border-radius: 6px;
      background: #fff;
      color: #1565c0;
      font-size: 20px;
      line-height: 36px;
      cursor: pointer;
      font-family: inherit;
    }

    .menu-btn:hover {
      background: #e3f2fd;
    }

    .menu-btn:focus-visible,
    .menu-list a:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    .menu-list {
      position: absolute;
      top: 44px;
      right: 0;
      min-width: 200px;
      padding: 4px 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .menu-head {
      padding: 6px 14px 4px;
      font-size: 11px;
      color: #9e9e9e;
      text-transform: uppercase;
    }

    .menu-list a {
      display: block;
      padding: 8px 14px;
      font-size: 14px;
      color: #212121;
      text-decoration: none;
      white-space: nowrap;
    }

    .menu-list a:hover {
      background: #e3f2fd;
    }

    /* ---------- Master Page: tab bar ---------- */
    .tabbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      padding: 10px 24px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .tab-btn {
      padding: 10px 6px;
      border: 1px solid #1565c0;
      border-radius: 6px;
      background: #fff;
      color: #1565c0;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn:hover {
      background: #e3f2fd;
    }

    .tab-btn[aria-selected="true"] {
      background: #1565c0;
      color: #fff;
    }

    .tab-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .tab-btn:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    /* ---------- Master Page: group sections (Upcoming, Group Orders) ---------- */
    .grp {
      margin-bottom: 14px;
    }

    .grp-head {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid #e0e0e0;
      border-left: 6px solid var(--gc, #c4c4c4);
      border-radius: 8px;
      background: #fafafa;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #212121;
      text-align: left;
      cursor: pointer;
    }

    .grp-head:focus-visible {
      outline: 3px solid #90caf9;
      outline-offset: 2px;
    }

    .grp-caret {
      display: inline-block;
      color: #616161;
      transition: transform .15s ease;
    }

    .grp.collapsed .grp-caret {
      transform: rotate(-90deg);
    }

    .grp.collapsed .grp-body {
      display: none;
    }

    .grp-count {
      margin-left: auto;
      font-size: 13px;
      font-weight: 400;
      color: #616161;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .tabbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 8px 12px;
      }
    }

    @media (max-width: 600px) {
      .vals {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .item {
        padding-top: 36px;
      }

      .item-head,
      .item.two-tabs .item-head {
        padding-right: 0;
      }

      .item-head {
        padding-right: 0;
      }

      .cs-tab {
        max-width: 80%;
      }

      .item-name {
        text-align: left;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <div class="card loading" id="card">
    <div class="card-header">
      <div class="tech-menu hidden" id="techMenu">
        <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false"
          aria-controls="menuList" aria-label="Tech pages" title="Tech pages">&#9776;</button>
        <div class="menu-list hidden" id="menuList" role="menu" aria-label="Tech pages"></div>
      </div>
      <div class="icon" id="icon">
        <div class="spinner"></div>
      </div>
      <h1 id="title">Loading...</h1>
    </div>
    <!-- Master Page tabs -->
    <div class="tabbar" id="tabBar" role="tablist" aria-label="Pages">
      <button type="button" class="tab-btn" role="tab" id="tab_last" data-page="last" aria-selected="false">Last Week</button>
      <button type="button" class="tab-btn" role="tab" id="tab_current" data-page="current" aria-selected="false">This Week</button>
      <button type="button" class="tab-btn" role="tab" id="tab_upcoming" data-page="upcoming" aria-selected="false">Upcoming</button>
      <button type="button" class="tab-btn" role="tab" id="tab_groups" data-page="groups" aria-selected="false">Group Orders</button>
    </div>
    <div class="card-body">
      <p class="message" id="message">Please wait while the items are loaded.</p>
      <div id="review" class="hidden">
        <!-- <div class="page-nav hidden" id="proceedTop">
                  <button type="button" class="btn btn-small" id="proceedTopBtn">Proceed -&gt;</button>
                </div> -->
        <div class="page-nav" id="navTop">
          <!-- <button type="button" class="btn btn-small" id="navLastTop">&lt;- Last Week</button> -->
          <!-- <button type="button" class="btn btn-small" id="navThisTop">This Week -&gt;</button>  -->
          <button type="button" class="btn hidden" id="reviewBtn" disabled>Review &amp; Confirm</button>
        </div>
        <!-- </div> --><!-- Master Page: extra close tag. It closed #review early and pushed the footer outside the card (card shifted left). -->
        <div class="toolbar">
          <div class="who" id="whoBox">
            <label for="whoSelect">Confirmed by:</label>
            <select id="whoSelect"></select>
          </div>
          <!-- <button type="button" class="btn btn-small btn-outline" id="approveAllBtn">Approve All</button> -->
          <div class="tb-right">
            <button type="button" class="btn btn-small btn-outline" id="approveAllBtn">Approve All</button>
            <button type="button" class="btn btn-small btn-outline" id="toggleAllBtn" aria-controls="itemList">Collapse All</button>
            <button type="button" class="btn btn-small btn-outline hidden" id="groupsBtn" aria-controls="itemList">Collapse Groups</button>
            <button type="button" class="btn btn-small btn-outline hidden" id="refreshBtn">Refresh</button>
          </div>
        </div>
        <p class="counts" id="counts" aria-live="polite"></p>
        <div id="itemList"></div>
      </div>
      <div id="results" class="hidden"></div>
    </div>
    <div class="card-footer" id="footer">
      <button type="button" class="btn hidden" id="backBtn">Back to Items</button>
      <!-- <button type="button" class="btn hidden" id="proceedBtn">Proceed -&gt;</button> -->
      <span class="nav-foot" id="navFoot">
        <!-- <button type="button" class="btn" id="navLast">&lt;- Last Week</button> -->
        <!-- <button type="button" class="btn" id="navThis">This Week -&gt;</button> -->
      </span>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <h2 id="confirmTitle">Confirm Approvals</h2>
      <div class="modal-body" id="confirmBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="btn" id="submitBtn">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // UPDATE THIS to the Upcoming Week Review Apps Script deployment URL (/exec).
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzL7g4h_t1H7Ki6igol5MU4QAOK3T5DLIy0cBW3joQssNC81WzZekPp2cY_tGbBEJfQ/exec";
    // People who can be selected as the confirmer. The first entry is the default.
    var CONFIRMERS = ["Joshua McCann"];
    // Tech pages in the top-right menu (from tech_links.json). Each opens in a new tab.
    var TECH_LINKS = [
      { name: "Andrew Stump", link: "https://dtsiracusa.github.io/tech-review/?k=f7a5dec6e564f46a" },
      { name: "Michael Koepke", link: "https://dtsiracusa.github.io/tech-review/?k=b525ef723e76cca2" },
      { name: "Kyle Ruffer", link: "https://dtsiracusa.github.io/tech-review/?k=f932b83881bfc699" },
      { name: "Tom Zwiebel", link: "https://dtsiracusa.github.io/tech-review/?k=5d32e2bca8f9b50e" },
      { name: "Justin Hogrefe", link: "https://dtsiracusa.github.io/tech-review/?k=05557c3f4f8379bb" },
      { name: "Michael Grotemat", link: "https://dtsiracusa.github.io/tech-review/?k=ce6e8d717dd4fec9" }
    ];
    var LOAD_TIMEOUT_MS = 60000;
    var SUBMIT_TIMEOUT_MS = 180000;

    // Column placement on the card (IDs from upcoming_week_columns.json)
    var COLOR_COL = "color_mkzwg28s";          // left border
    var REVIEW_COL = "color_mm4eb90g";         // top-right tab
    var ORDER_COL = "color_mm2nbg4w";          // top-right tab, left of Review Status (Last Week Review only)
    var ORDER_DEFAULT = "Open";                // shown when Order Status is blank
    var ORDER_DEFAULT_COLOR = "";              // optional hex for blank Order Status, e.g. "#579bfc"; "" = use the color monday returns for "Open"
    var TECH_APPROVED_COL = "color_mm8dp78e";
    var SOLD_TO_COL = "text_mm1b4w1t";         // header left
    var CITY_COL = "text_mm1dy2mz";            // header left
    var CHIP_COLS = ["color_mm1c7719", "color_mm1jzrpg", "color_mm8dp78e"];
    // Field grid, 4 per row, left to right
    var GRID_COLS = [
      "date_mm07cg6e", "text_mm6bsqmj", "text_mm6dtr7m", "text_mm2d9dby",
      "multiple_person_mm1jx2c0", "phone_mm2esv7g", "phone_mm6dsdnq", "phone_mm2cz2nr"

    var jsonpSeq = 0;

      var name = "uwCb" + (++jsonpSeq) + "_" + Date.now();
      var finished = false;
      var script = document.createElement("script");
      var timer = setTimeout(function () {
        end({
          success: false, title: "Taking Too Long",
          message: "The service didn't respond. Reload the page to see the current state before trying again."
        });
      }, timeoutMs);
      function end(res) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
        done(res || { success: false, title: "Error", message: "Empty response." });
      }
      window[name] = end;
      script.src = APPS_SCRIPT_URL + "?" + query + "&callback=" + name + "&_=" + Date.now();
      script.onerror = function () {
        end({ success: false, title: "Error", message: "Couldn't reach the service. Try again in a few minutes." });
      };
      document.body.appendChild(script);
    }

    function el(tag, cls, text) {

    function link(text, url) {

    function validHex(h) { return /^#[0-9a-f]{6}$/i.test(h || ""); }

    // ---------- Master Page: load / tab switching ----------
    // Tabs: "last" = Last Week, "current" = This Week, "upcoming" = Upcoming, "groups" = Group Orders.
    // Each tab keeps its last response and collapse states. Switching tabs reuses them;
    // Back to Items, Refresh, or a failed load requests new data.
    // On page load: Last Week + (This Week and Upcoming in one request). Group Orders loads on first selection.
    var TAB_NAMES = { last: "Last Week Review", current: "This Week Review", upcoming: "Upcoming", groups: "Group Orders" };
    var LOAD_MSG = {
      last: "Please wait while last week's items are loaded.",
      current: "Please wait while this week's items are loaded.",
      upcoming: "Please wait while the upcoming weeks' items are loaded.",
      groups: "Please wait while the Group Orders items are loaded."
    };
    var pages = {
      last: { data: null, collapsed: {}, loading: false },
      current: { data: null, collapsed: {}, loading: false },
      upcoming: { data: null, collapsed: {}, loading: false },
      groups: { data: null, collapsed: {}, loading: false }
    };
    var sectionCollapsed = {};   // groupId -> true (collapsed) | false (expanded); sections start expanded

    function notConfigured() {
      if (APPS_SCRIPT_URL.indexOf("PASTE") !== 0) return false;
      setState("fail", "\u2718", "Not Configured", "APPS_SCRIPT_URL has not been set in this page.");
      return true;
    }
    function showLoading(msg) {
      spinner("Loading...", msg);
      $("review").classList.add("hidden");
      $("results").classList.add("hidden");
      $("reviewBtn").classList.add("hidden");
      $("backBtn").classList.add("hidden");
      $("toggleAllBtn").classList.add("hidden");
      $("groupsBtn").classList.add("hidden");
    }
    function showFail(res) {
      setState("fail", "\u2718", res.title || "Error", res.message || "");
      $("review").classList.add("hidden");
      $("backBtn").classList.remove("hidden");
    }
    // Flattens [{ id, title, color, items }] so counts and Collapse All work on all cards.
    function sectionData(sections) {
      var items = [];
      sections.forEach(function (sec) { items = items.concat(sec.items || []); });
      return { items: items, sections: sections };
    }
    function isOn(p) { return page === p; }

    // This Week + Upcoming (one request)
    function load() {
      if (notConfigured()) return;
      pages.current.data = null; pages.upcoming.data = null;
      pages.current.loading = true; pages.upcoming.loading = true;
      if (isOn("current") || isOn("upcoming")) showLoading(LOAD_MSG[page]);
      callApi("action=load", LOAD_TIMEOUT_MS, onLoad);
    }
    function onLoad(res) {
      pages.current.loading = false; pages.upcoming.loading = false;
      if (!res.success) {
        if (isOn("current") || isOn("upcoming")) showFail(res);   // other tabs: try again when selected
        return;
      }
      pages.current.data = res;
      choices = {};
      pages.current.collapsed = {};
      pages.upcoming.data = sectionData(res.upcoming || []);
      pages.upcoming.collapsed = {};
      if (isOn("current") || isOn("upcoming")) renderPage();

    function loadLast() {
      if (notConfigured()) return;

      callApi("action=loadLast", LOAD_TIMEOUT_MS, onLoadLast);
    }
    function onLoadLast(res) {
      pages.last.loading = false;
      if (!res.success) {
        if (isOn("last")) showFail(res);
        return;
      }
      pages.last.data = res;
      pages.last.collapsed = {};
      if (isOn("last")) renderPage();

    // Tab buttons: the tab on screen is marked selected. All tabs are disabled while submitting.

    // Group section header and body. Returns the body that cards are added to.
    function sectionBox(sec, list) {

      head.type = "button";
      head.setAttribute("aria-controls", bodyId);
      head.appendChild(el("span", "grp-caret", "\u25BE"));

      head.appendChild(el("span", "grp-count", (sec.items || []).length + " job(s)"));
      var box = el("div", "grp-body");
      box.id = bodyId;
      if (!(sec.items || []).length) box.appendChild(el("p", "note", "No jobs in this group."));
      function apply(on) {
        sectionCollapsed[sec.id] = on;
        wrap.classList.toggle("collapsed", on);
        head.setAttribute("aria-expanded", on ? "false" : "true");
        head.title = on ? "Show group" : "Hide group";
      }
      // head.addEventListener("click", function () { apply(!wrap.classList.contains("collapsed")); });
      head.addEventListener("click", function () { apply(!wrap.classList.contains("collapsed")); refreshGroupsBtn(); });
      wrap.applyCollapse = apply;   // used by Collapse Groups / Expand Groups
      wrap.appendChild(head);
      wrap.appendChild(box);
      list.appendChild(wrap);
      return box;
    }

    // ---------- Render ----------
    function renderItems() {
      var list = $("itemList");
      list.textContent = "";
      var osDefaultBg = page === "last" ? orderDefaultColor() : "";
      // Master Page: Upcoming and Group Orders are drawn as one section per group; other tabs are one flat list.
      var secs = data.sections || [{ items: data.items }];
      secs.forEach(function (sec) {
      var target = data.sections ? sectionBox(sec, list) : list;
      sec.items.forEach(function (it) {
        var f = fieldMap(it);
        // var disabled = !!it.approved;
        // var readOnly = page === "last";                // Last Week Review: no choices, never greyed out
        var readOnly = page !== "current";             // only This Week has choices; view-only tabs are never greyed out
        var disabled = !readOnly && !!it.approved;
        var item = el("div", "item" + (disabled ? " disabled" : ""));
        item.setAttribute("data-id", it.id);
        if (validHex(it.colorStatusColor)) item.style.setProperty("--gc", it.colorStatusColor);

        // Top-right: Order Status tab (Last Week Review only) and Review Status tab, side by side
        var tabs = el("div", "tabs");
        // if (readOnly) {
        if (page === "last") {
          var os = f[ORDER_COL] || {};
          var osText = os.text || ORDER_DEFAULT;
          var osTab = el("div", "cs-tab");
          osTab.appendChild(el("span", null, os.title || "Order Status"));
          osTab.appendChild(document.createTextNode(osText));
          var osBg = (os.text && validHex(os.color)) ? os.color : osDefaultBg;
          osTab.style.background = osBg; osTab.style.color = textOn(osBg);
          osTab.title = "Order Status: " + osText;
          tabs.appendChild(osTab);
          item.classList.add("two-tabs");
        }

        // Top-right: Review Status tab
        var rv = f[REVIEW_COL] || {};

        var rvText = rv.text || "Not Yet";
        var tab = el("div", "cs-tab");
        tab.appendChild(el("span", null, "Review Status"));
        tab.appendChild(document.createTextNode(rvText));
        var bg = (rv.text && validHex(rv.color)) ? rv.color : "#c4c4c4";
        tab.style.background = bg; tab.style.color = textOn(bg);
        tab.title = "Review Status: " + rvText;
        // item.appendChild(tab);
        tabs.appendChild(tab);
        item.appendChild(tabs);

        // Header (left): caret, item name, Sold To, City
        var head = el("div", "item-head");
        var headLeft = el("div", "head-left");
        var bodyId = "body_" + it.id;
        var caret = el("button", "caret", "\u25BE");
        caret.type = "button";
        caret.setAttribute("aria-controls", bodyId);
        caret.addEventListener("click", function () {
          setCollapsed(item, it.id, !item.classList.contains("collapsed"));
        });
        headLeft.appendChild(caret);
        var left = el("div");
        var n = el("div", "item-name");
        // n.appendChild(link(it.name, it.srUrl || it.url));
        // n.title = it.srUrl ? "Open Service Request" : "Open in monday";
        // if (readOnly) {
        if (page === "last") {
          n.appendChild(link(it.name, it.visitUrl));     // plain text when Tech Visit is blank
          if (it.visitUrl) n.title = "Open Tech Visit";
        } else {
          n.appendChild(link(it.name, it.srUrl || it.url));
          n.title = it.srUrl ? "Open Service Request" : "Open in monday";
        }
        left.appendChild(n);
        left.appendChild(el("div", "soldto", dash(f[SOLD_TO_COL] && f[SOLD_TO_COL].text)));
        left.appendChild(el("div", "city", dash(f[CITY_COL] && f[CITY_COL].text)));
        headLeft.appendChild(left);
        head.appendChild(headLeft);
        item.appendChild(head);
        // Collapsible body: chips, field grid, notes
        var body = el("div", "item-body");
        body.id = bodyId;

        // Status chips
        var chips = el("div", "chips");
        CHIP_COLS.forEach(function (id) {
          var x = f[id]; if (!x) return;
          var d = el("div");
          d.appendChild(el("span", "label", x.title));
          var txt = x.text || ((id === REVIEW_COL || id === TECH_APPROVED_COL) ? "Not Yet" : "");
          var c = el("span", "chip", dash(txt));
          if (txt && validHex(x.color)) { c.style.background = x.color; c.style.color = textOn(x.color); }
          d.appendChild(c);
          chips.appendChild(d);
        });
        body.appendChild(chips);

        // Field grid in GRID_COLS order (Review Status and Service Request are not listed)
        var vals = el("div", "vals");
        /*
        GRID_COLS.forEach(function (id) {
          var x = f[id]; if (!x) return;
          if (hideIfBlank(id, x)) return;
          var d = el("div");
          d.appendChild(el("span", "label", x.title));
          if (x.type === "link" && x.url) d.appendChild(link(x.text || x.url, x.url));
          else if (x.type === "phone") d.appendChild(document.createTextNode(dash(fmtPhone(x.text))));
          else d.appendChild(document.createTextNode(dash(x.text)));
          vals.appendChild(d);
        });
        */
        var anyShown = false;
        GRID_STACKS.forEach(function (stackIds) {
          var s = el("div", "stack");
          stackIds.forEach(function (id) {
            var x = f[id]; if (!x) return;
            if (hideIfBlank(id, x)) return;
            var d = el("div");
            d.appendChild(el("span", "label", x.title));
            if (x.type === "link" && x.url) d.appendChild(link(x.text || x.url, x.url));
            else if (x.type === "phone") d.appendChild(document.createTextNode(dash(fmtPhone(x.text))));
            else d.appendChild(document.createTextNode(dash(x.text)));
            s.appendChild(d);
          });
          if (s.childNodes.length) anyShown = true;
          if (s.childNodes.length || KEEP_EMPTY_STACKS) vals.appendChild(s);
        });
        // body.appendChild(vals);
        // if (vals.childNodes.length) body.appendChild(vals);
        if (anyShown) body.appendChild(vals);

        // Notes (full width)
        NOTE_COLS.forEach(function (id) {
          var x = f[id]; if (!x) return;
          if (hideIfBlank(id, x)) return;
          var d = el("div", "notes");
          d.appendChild(el("span", "label", x.title));
          d.appendChild(document.createTextNode(dash(x.text)));
          body.appendChild(d);
        });
        item.appendChild(body);
        setCollapsed(item, it.id, isCollapsed(it));

        // Choices or note
        if (readOnly) {
          // Last Week Review: view only, no choices
          // Upcoming / Group Orders: view only; show who approved when Review Status is Approved
          if (page !== "last" && it.approved) item.appendChild(el("div", "note", it.note || "Already Approved."));
        } else if (disabled) {
          item.appendChild(el("div", "note", it.note || "Already Approved."));
        } else {
          /*
          var ch = el("div", "choices");
          ch.setAttribute("role", "radiogroup");
          ch.setAttribute("aria-label", "Review for " + it.name);
          [["approve", "Approve"], ["leave", "Leave as is"]].forEach(function (o) {
            var lab = el("label");
            var r = document.createElement("input");
            r.type = "radio"; r.name = "ch_" + it.id; r.value = o[0];
            r.checked = (choices[it.id] || "leave") === o[0];
            r.addEventListener("change", function () {
              choices[it.id] = o[0];
              setCollapsed(item, it.id, o[0] === "approve");
              refreshChoiceStyles(ch);
              updateReviewBtn();
            });
            lab.appendChild(r); lab.appendChild(document.createTextNode(o[1]));
            ch.appendChild(lab);
          });
          refreshChoiceStyles(ch);
          item.appendChild(ch);
          */
          var ch = el("div", "choices");
          var tg = el("button", "approve-toggle", "Approve");
          tg.type = "button";
          tg.setAttribute("aria-label", "Approve " + it.name);
          var on0 = choices[it.id] === "approve";
          tg.classList.toggle("on-approve", on0);
          tg.setAttribute("aria-pressed", on0 ? "true" : "false");
          // Tap once to select Approve, tap again to clear it
          tg.addEventListener("click", function () {
            var on = choices[it.id] !== "approve";
            if (on) choices[it.id] = "approve"; else delete choices[it.id];
            tg.classList.toggle("on-approve", on);
            tg.setAttribute("aria-pressed", on ? "true" : "false");
            setCollapsed(item, it.id, on);   // collapse on Approve, expand when cleared
            updateReviewBtn();
          });
          ch.appendChild(tg);
          item.appendChild(ch);
        }
        // list.appendChild(item);
        target.appendChild(item);
      });
      });   // Master Page: end of sections loop
      updateCounts();
      refreshToggle();
    }

    // Color for a blank Order Status: ORDER_DEFAULT_COLOR if set, else the color monday returned for "Open" on any loaded item
    function orderDefaultColor() {
      if (validHex(ORDER_DEFAULT_COLOR)) return ORDER_DEFAULT_COLOR;
      for (var i = 0; i < data.items.length; i++) {
        var x = fieldMap(data.items[i])[ORDER_COL];
        if (x && x.text === ORDER_DEFAULT && validHex(x.color)) return x.color;
      }
      return "#c4c4c4";
    }
    function refreshChoiceStyles(ch) {

      Array.prototype.forEach.call(ch.querySelectorAll("label"), function (lab) {
        var r = lab.querySelector("input");
        lab.className = r.checked && r.value === "approve" ? "on-approve" : "";
      });
    }
    // Default: collapsed when already Approved on the board, or when Approve is selected.
    function isCollapsed(it) {
      if (Object.prototype.hasOwnProperty.call(collapsed, it.id)) return collapsed[it.id];
      if (page === "last") return false; // Last Week Review: cards start expanded
      return !!it.approved || choices[it.id] === "approve";
    }
    function setCollapsed(item, id, on) {
      collapsed[id] = on;
      item.classList.toggle("collapsed", on);
      var c = item.querySelector(".caret");
      if (c) {
        c.setAttribute("aria-expanded", on ? "false" : "true");
        c.setAttribute("aria-label", (on ? "Expand" : "Collapse") + " details");
        c.title = on ? "Show details" : "Hide details";
      }
      refreshToggle();
    }
    // ---------- Expand All / Collapse All (all cards, including greyed-out ones) ----------
    function allCards() { return Array.prototype.slice.call($("itemList").querySelectorAll(".item")); }
    function anyCollapsed(cards) {
      return cards.some(function (c) { return !!collapsed[c.getAttribute("data-id")]; });
    }
    function refreshToggle() {
      var b = $("toggleAllBtn"); if (!b) return;
      var cards = allCards();
      b.textContent = anyCollapsed(cards) ? "Expand All" : "Collapse All";
      b.disabled = cards.length === 0;
    }
    function toggleAll() {
      var cards = allCards();
      var collapse = !anyCollapsed(cards);   // any collapsed -> expand all; none collapsed -> collapse all
      cards.forEach(function (c) { setCollapsed(c, c.getAttribute("data-id"), collapse); });
      // Master Page: Expand All also opens collapsed group sections
      // (Replaced by the separate Collapse Groups / Expand Groups button.)
      // if (!collapse) {
      //   Array.prototype.forEach.call($("itemList").querySelectorAll(".grp.collapsed .grp-head"), function (h) { h.click(); });
      // }
      refreshToggle();
    }

    // ---------- Master Page: Expand Groups / Collapse Groups (Upcoming, Group Orders) ----------
    function allSections() { return Array.prototype.slice.call($("itemList").querySelectorAll(".grp")); }
    function refreshGroupsBtn() {
      var b = $("groupsBtn"); if (!b) return;
      var secs = allSections();
      var any = secs.some(function (g) { return g.classList.contains("collapsed"); });
      b.textContent = any ? "Expand Groups" : "Collapse Groups";
      b.disabled = secs.length === 0;
    }
    function toggleGroups() {
      var secs = allSections();
      var collapse = !secs.some(function (g) { return g.classList.contains("collapsed"); });   // any collapsed -> expand all
      secs.forEach(function (g) { if (g.applyCollapse) g.applyCollapse(collapse); });
      refreshGroupsBtn();
    }

    function available() { return data.items.filter(function (it) { return !it.approved; }); }
    function selected() { return available().filter(function (it) { return choices[it.id] === "approve"; }); }

    function updateCounts() {
      if (!data) return;
      if (page === "last") {
        $("counts").textContent = data.items.length + " job(s) scheduled " + data.weekText + ".";
        return;
      }
      if (page === "upcoming" || page === "groups") {
        $("counts").textContent = data.items.length + " job(s) in " + (data.sections || []).length + " group(s).";
        return;
      }
      $("counts").textContent = data.items.length + " item(s), " + available().length + " awaiting review, " +
        selected().length + " selected to approve.";
    }
    function updateReviewBtn() {
      $("reviewBtn").disabled = busy || selected().length === 0;
      $("approveAllBtn").disabled = busy || available().length === 0;
      $("approveAllBtn").textContent = allPicked() ? "Clear All" : "Approve All";
      updateCounts();
    }
    function allPicked() {
      var a = available();
      return a.length > 0 && a.every(function (it) { return choices[it.id] === "approve"; });
    }
    function approveAll() {
      if (allPicked()) {
        // Clear All: remove every selection and expand those cards
        available().forEach(function (it) { delete choices[it.id]; collapsed[it.id] = false; });
        renderItems();
        updateReviewBtn();
        return;
      }
      available().forEach(function (it) { choices[it.id] = "approve"; collapsed[it.id] = true; });
      renderItems();
      updateReviewBtn();
    }

    // ---------- Confirm ----------
    function openConfirm() {
      var ap = selected();
      var body = $("confirmBody");
      body.textContent = "";
      body.appendChild(el("div", null, "Confirmed by: " + $("whoSelect").value));
      body.appendChild(el("p", null, "Set Review Status to Approved on " + ap.length + " job(s):"));
      var ul = el("ul");
      ap.forEach(function (it) {
        var f = fieldMap(it);
        var sold = f[SOLD_TO_COL] && f[SOLD_TO_COL].text;
        ul.appendChild(el("li", null, it.name + (sold ? " \u2014 " + sold : "")));
      });
      body.appendChild(ul);
      $("confirmModal").classList.add("open");
      $("submitBtn").focus();
    }
    function closeConfirm() { $("confirmModal").classList.remove("open"); }

    function submit() {
      if (busy) return;
      busy = true;
      // setnav();   // typo: setnav is not defined, so Review & Confirm stopped here
      setNav();
      closeConfirm();
      var ids = selected().map(function (it) { return it.id; });
      $("review").classList.add("hidden");
      $("reviewBtn").classList.add("hidden");
      spinner("Submitting...", "Approving " + ids.length + " job(s). This can take a minute; don't close this tab.");
      callApi("action=commit&ids=" + encodeURIComponent(ids.join(",")) +
        "&who=" + encodeURIComponent($("whoSelect").value), SUBMIT_TIMEOUT_MS, onSubmit);
    }

    function onSubmit(res) {
      busy = false;
      upData = null;
      pages.current.data = null;    // This Week and Upcoming reload on Back to Items or next tab visit
      pages.upcoming.data = null;
      setNav();
      if (!res.success) {
        setState("fail", "\u2718", res.title || "Error", res.message || "");
        $("backBtn").classList.remove("hidden");
        return;
      }
      var bad = res.results.filter(function (r) { return r.result !== "OK"; }).length;
      setState(bad ? "info" : "success", bad ? "" : "\u2714", bad ? "Submitted With Notes" : "Done",
        bad ? "Some items need attention. Details are below and in the log." : "All selected jobs were approved.");
      var box = $("results");
      box.textContent = "";
      res.results.forEach(function (r) {
        var row = el("div", "result-row " + String(r.result || "").toLowerCase());
        row.appendChild(el("strong", null, r.name + " \u2014 " + r.action + ": " + r.result));
        if (r.note) row.appendChild(el("div", "note" + (r.result === "OK" ? "" : " warn"), r.note));
        box.appendChild(row);
      });
      box.classList.remove("hidden");
      $("backBtn").classList.remove("hidden");
    }

    // ---------- Init ----------
    (function init() {
      var sel = $("whoSelect");
      CONFIRMERS.forEach(function (n, i) {
        var o = el("option", null, n); o.value = n; if (i === 0) o.selected = true; sel.appendChild(o);
      });
      $("approveAllBtn").addEventListener("click", approveAll);
      $("reviewBtn").addEventListener("click", openConfirm);
      $("cancelBtn").addEventListener("click", closeConfirm);
      $("submitBtn").addEventListener("click", submit);
      // $("backBtn").addEventListener("click", load);
      // $("backBtn").addEventListener("click", function () { if (page === "last") loadLast(); else load(); });
      $("backBtn").addEventListener("click", function () { reload(page); });
      $("refreshBtn").addEventListener("click", function () { if (!busy) loadGroups(); });
      $("groupsBtn").addEventListener("click", toggleGroups);
      $("toggleAllBtn").addEventListener("click", toggleAll);
      // $("proceedTopBtn").addEventListener("click", proceed);
      // $("proceedBtn").addEventListener("click", proceed);
      // ["navLastTop"].forEach(function (id) { $(id).addEventListener("click", function () { goTo("last"); }); });
      // ["navThisTop"].forEach(function (id) { $(id).addEventListener("click", function () { goTo("upcoming"); }); });
      Array.prototype.forEach.call($("tabBar").querySelectorAll(".tab-btn"), function (b) {
        b.addEventListener("click", function () { goTo(b.getAttribute("data-page")); });
      });
      // Arrow keys move between tabs
      $("tabBar").addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        var tabs = Array.prototype.slice.call($("tabBar").querySelectorAll(".tab-btn"));
        var i = tabs.indexOf(document.activeElement); if (i === -1) return;
        var nx = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
        nx.focus(); nx.click();
      });
      buildMenu();
      $("menuBtn").addEventListener("click", function (e) {
        e.stopPropagation();
        if ($("menuList").classList.contains("hidden")) openMenu(); else closeMenu();
      });
      document.addEventListener("click", function (e) {
        if (!$("techMenu").contains(e.target)) closeMenu();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && $("confirmModal").classList.contains("open")) closeConfirm();
        if (e.key === "Escape" && !$("menuList").classList.contains("hidden")) { closeMenu(); $("menuBtn").focus(); }
      });
      //load();
      //loadLast();
      //prefetchUpcoming();
      showPage("last");
      loadLast();   // Last Week Review is shown first
      load();       // This Week + Upcoming load in the background (Group Orders loads when its tab is selected)
    })();
  </script>
</body>

</html>
